# fly.toml for rinoleggioMVP — https://fly.io/docs/reference/configuration/

app = 'rinoleggiomvp'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = 'rinoleggio_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
